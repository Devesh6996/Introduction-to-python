[project]
name = "introduction-to-python"
version = "0.1.0"
description = "Python clone"
readme = "README.md"
authors = [
    { name = "Dev", email = "devesh6996@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[project.scripts]
introduction-to-python = "introduction_to_python:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
